name: Shared-origin injected HTML and URL regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/security.test.cjs
